<script>
// AlunoScripts.html
// Responsabilidade: toda a logica de frontend do Painel Aluno. Arquivo
// independente de Scripts.html (pagina separada, estado separado) — nenhuma
// funcao daqui e compartilhada com o Painel de Thales.

// === TEMA (claro/escuro) — mesmo comportamento do Painel de Thales ===
function temaPreferidoSistema() {
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function aplicarTema(tema) {
  document.documentElement.setAttribute('data-theme', tema);
  var icone = document.getElementById('iconeTema');
  if (icone) icone.textContent = tema === 'dark' ? ICONES.temaClaro : ICONES.temaEscuro;
}
function inicializarTema() {
  var salvo = null;
  try { salvo = localStorage.getItem('painelAlunoTema'); } catch (e) {}
  aplicarTema(salvo || temaPreferidoSistema());
}
function alternarTema() {
  var atual = document.documentElement.getAttribute('data-theme') || 'light';
  var novo = atual === 'dark' ? 'light' : 'dark';
  aplicarTema(novo);
  try { localStorage.setItem('painelAlunoTema', novo); } catch (e) {}
}

// === HELPERS DE REGRA DE NEGOCIO (mesma logica de Scripts.html) ===
var STATUS_FINAIS = ['ok', 'protocolado', 'cancelada'];
var TOAST_ICONES = { sucesso: ICONES.sucesso, erro: ICONES.erro, '': ICONES.info };

function normalizarChave(valor) {
  return String(valor || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim()
    .toLowerCase();
}

function ehAtraso(reg) {
  return reg.atraso === true || reg.atraso === 'true';
}

// Registros Cancelados continuam aparecendo nas tabelas (com a badge normal),
// mas nao entram nas contagens dos cards de resumo (decisao de Thales).
function naoEhCancelada(reg) {
  return normalizarChave(reg.status) !== 'cancelada';
}

function classificarRegistro(reg) {
  if (ehAtraso(reg)) return 'atraso';
  var chave = normalizarChave(reg.status);
  if (chave === 'ok' || chave === 'protocolado') return 'concluido';
  if (chave === 'encaminhado') return 'encaminhado';
  if (chave === 'entregue') return 'entregue';
  if (chave === 'devolvida') return 'devolvida';
  if (chave === 'cancelada') return 'cancelada';
  return 'outros';
}

function normalizarStatusParaUI(status) {
  var chave = normalizarChave(status);
  if (!chave) return '';
  if (chave === 'ok') return 'Ok';
  if (chave === 'protocolado') return 'Protocolado';
  if (chave === 'encaminhado') return 'Encaminhado';
  if (chave === 'devolvida') return 'Devolvida';
  if (chave === 'entregue') return 'Entregue';
  if (chave === 'cancelada') return 'Cancelada';
  return String(status || '').trim();
}

function badgeStatus(reg) {
  var cl = classificarRegistro(reg);
  var badgeBase;
  if (cl === 'atraso') {
    badgeBase = '<span class="badge badge-atraso">Em Atraso</span>';
  } else {
    var s = normalizarStatusParaUI(reg.status);
    if (!s) {
      badgeBase = '<span class="badge badge-vazio">—</span>';
    } else {
      var chave = normalizarChave(s);
      if (chave === 'ok' || chave === 'protocolado') badgeBase = '<span class="badge badge-concluido">' + s + '</span>';
      else if (chave === 'encaminhado') badgeBase = '<span class="badge badge-encaminhado">Encaminhado</span>';
      else if (chave === 'entregue') badgeBase = '<span class="badge badge-entregue">Entregue</span>';
      else if (chave === 'devolvida') badgeBase = '<span class="badge badge-devolvida">Devolvida</span>';
      else if (chave === 'cancelada') badgeBase = '<span class="badge badge-cancelada">Cancelada</span>';
      else badgeBase = '<span class="badge badge-vazio">' + s + '</span>';
    }
  }
  return badgeBase + badgeGatilho(reg);
}

function badgeGatilho(reg) {
  if (!reg.gatilho) return '';
  var mapa = {
    gatilho1: { classe: 'gatilho-amarelo', titulo: 'Vence em 5 dias úteis' },
    gatilho2: { classe: 'gatilho-laranja', titulo: 'Vence amanhã (dia útil)' },
    gatilho3: { classe: 'gatilho-vermelho', titulo: 'Vence hoje' }
  };
  var info = mapa[reg.gatilho];
  if (!info) return '';
  return '<span class="badge-gatilho ' + info.classe + '" title="' + info.titulo + '">' +
    '<span class="material-symbols-outlined" style="font-size:13px;">' + ICONES.prazoProximo + '</span>' +
  '</span>';
}

function popularSelectSimples(select, valores, valorAtual, placeholder) {
  select.innerHTML = '<option value="">' + placeholder + '</option>';
  var incluidos = {};
  (valores || []).forEach(function(v) {
    var chave = normalizarChave(v);
    if (!chave || incluidos[chave]) return;
    incluidos[chave] = true;
    var opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    if (chave === normalizarChave(valorAtual)) opt.selected = true;
    select.appendChild(opt);
  });
  if (valorAtual && !incluidos[normalizarChave(valorAtual)]) {
    var optAtual = document.createElement('option');
    optAtual.value = valorAtual;
    optAtual.textContent = valorAtual;
    optAtual.selected = true;
    select.appendChild(optAtual);
  }
}

// === LOADING / TOAST ===
function mostrarLoading(show) {
  var el = document.getElementById('loadingWrapper');
  var conteudo = document.getElementById('conteudoPrincipal');
  if (el) el.style.display = show ? 'block' : 'none';
  if (conteudo) conteudo.style.display = show ? 'none' : 'block';
}

function mostrarToast(msg, tipo) {
  var el = document.getElementById('toast');
  var icone = TOAST_ICONES[tipo || ''] || ICONES.info;
  el.innerHTML = '<span class="material-symbols-outlined" style="font-size:18px;">' + icone + '</span> ' + msg;
  el.className = 'toast ' + (tipo || '');
  el.classList.add('visivel');
  clearTimeout(PA._toastTimer);
  PA._toastTimer = setTimeout(function() { el.classList.remove('visivel'); }, 3200);
}

// === MENU REGISTRAR (dropdown) ===
function paAlternarMenuRegistrar() {
  var menu = document.getElementById('paMenuRegistrar');
  var btn = document.getElementById('btnPaRegistrar');
  var abrindo = !menu.classList.contains('visivel');
  menu.classList.toggle('visivel', abrindo);
  btn.classList.toggle('aberto', abrindo);
}

function paFecharMenuRegistrar() {
  document.getElementById('paMenuRegistrar').classList.remove('visivel');
  document.getElementById('btnPaRegistrar').classList.remove('aberto');
}

document.addEventListener('click', function(e) {
  var dropdown = document.getElementById('paDropdownRegistrar');
  if (dropdown && !dropdown.contains(e.target)) paFecharMenuRegistrar();
});

function paAcaoRegistrarEmBreve(nomeAcao) {
  mostrarToast(nomeAcao + ' — funcionalidade ainda em desenvolvimento.', '');
}

// === ESTADO GLOBAL ===
var PA = {
  tipo: '',
  nomeUsuario: '',
  emailUsuario: '',
  dados: {
    estagiarios: [],
    diligencias: [],
    iniciais: [],
    atendimentos: [],
    acompanhamentos: [],
    atendimentosOnline: [],
    atividadesElegiveisAO: [],
    audienciasEstagiario: [],
    parametrosAudiencias: [],
    especiePicklistIniciais: []
  },
  avisoComprovanteAudiencia: '',
  // Valor de turma/semestre selecionado no seletor hierarquico: um codigo de
  // turma completo ("2026.02-A") para uma turma especifica, ou so o semestre
  // base ("2026.02") para "Todas as turmas" — ver paPopularSeletores. Definido
  // a partir de PA.dados.turmaCorrente (backend, Turma.js) na primeira carga.
  turmaFiltro: '',
  alunoSelecionado: null, // { nome, email } — so usado quando tipo === 'thales'
  _diligenciasAtuais: [],
  _iniciaisAtuais: [],
  _acompanhamentosAtuais: [],
  _atendimentosAtuais: [],
  _atendimentosOnlineAtuais: [],
  _atendimentoOnlineEmEdicao: null, // registro atual aberto no modal de detalhe (Reprovado -> editavel)
  _audienciasAtuais: [],
  _audienciaEmEdicao: null, // registro atual aberto no modal de detalhe (Pendente/Reprovada -> editavel)
  _toastTimer: null
};

// === INICIALIZACAO ===
document.addEventListener('DOMContentLoaded', function() {
  inicializarTema();
  paAtualizarSaudacaoPrefixo();
  paConfigurarCopiarProcesso();
  paConfigurarFechamentoModais();
  paConfigurarMascaraCpf();
  paCarregarDados();
});

function paAtualizarSaudacaoPrefixo() {
  var el = document.getElementById('saudacaoUsuario');
  if (!el) return;
  var hora = new Date().getHours();
  var saudacao = 'Boa noite';
  if (hora >= 5 && hora < 12) saudacao = 'Bom dia';
  else if (hora >= 12 && hora < 18) saudacao = 'Boa tarde';
  var strong = el.querySelector('strong');
  var nomeHtml = strong ? strong.outerHTML : '';
  el.innerHTML = saudacao + ', ' + nomeHtml;
}

// === CARREGAMENTO DE DADOS ===
function paCarregarDados() {
  mostrarLoading(true);
  google.script.run
    .withSuccessHandler(function(resultado) {
      // resultado === null significa falha de serializacao no servidor (ver
      // nota em formatarHora, Data.js) — nunca um retorno legitimo. Sem esta
      // guarda o handler morria antes de mostrarLoading(false), e a pagina
      // ficava presa para sempre no spinner "Carregando dados...".
      if (!resultado) {
        paMostrarErroCarregamento('Resposta inválida do servidor.');
        return;
      }
      if (resultado.erro) {
        paMostrarErroCarregamento(resultado.erro);
        return;
      }

      PA.tipo = resultado.tipo;
      PA.nomeUsuario = resultado.nome;
      PA.emailUsuario = resultado.email;
      PA.dados.estagiarios = resultado.estagiarios || [];
      PA.dados.diligencias = resultado.diligencias || [];
      PA.dados.iniciais = resultado.iniciais || [];
      PA.dados.atendimentos = resultado.atendimentos || [];
      PA.dados.acompanhamentos = resultado.acompanhamentos || [];
      PA.dados.atendimentosOnline = resultado.atendimentosOnline || [];
      PA.dados.atividadesElegiveisAO = resultado.atividadesElegiveisAO || [];
      PA.dados.audienciasEstagiario = resultado.audienciasEstagiario || [];
      PA.dados.parametrosAudiencias = resultado.parametrosAudiencias || [];
      PA.dados.especiePicklistIniciais = resultado.especiePicklistIniciais || [];
      PA.avisoComprovanteAudiencia = resultado.avisoComprovanteAudiencia || '';
      PA.dados.turmaCorrente = resultado.turmaCorrente || '';

      mostrarLoading(false);
      paPopularSeletores();
      paRenderizarTudo();
    })
    .withFailureHandler(function(err) {
      paMostrarErroCarregamento(err.message);
    })
    .carregarDadosPainelAluno();
}

function paMostrarErroCarregamento(msg) {
  mostrarLoading(false);
  document.getElementById('paSeletores').style.display = 'none';
  document.getElementById('paConteudoAluno').style.display = 'none';
  var vazio = document.getElementById('paSemAluno');
  vazio.style.display = 'block';
  vazio.querySelector('.material-symbols-outlined').textContent = ICONES.erro;
  vazio.querySelector('.estado-vazio-titulo').textContent = 'Não foi possível carregar seus dados';
  vazio.querySelector('.estado-vazio-desc').textContent = msg || 'Tente recarregar a página.';
  document.getElementById('btnCriarPeticaoInicial').disabled = true;
}

// === SELETORES DE TURMA / ALUNO ===
// 27/07/2026: o seletor passou de SEMESTRE (flat) para um seletor hierarquico
// de TURMA — mesmo formato e mesma tecnica de Scripts.html (Panorama): para
// cada semestre presente nos estagiarios visiveis, 3 opcoes (Todas as
// turmas / Antecipado / Regular). Rotulos identicos aos de formatarRotuloTurma
// (Turma.js) — reaproveitados aqui em texto porque nao ha como chamar uma
// funcao server-side sincronamente do cliente.
function rotulosTurma(semestreBase) {
  return {
    todas: semestreBase + ' — Todas as turmas',
    antecipado: semestreBase + ' — Antecipado',
    regular: semestreBase + ' — Regular'
  };
}

// Porta cliente de turmaCasaComFiltro (Turma.js) — ver nota acima.
function turmaCasaComFiltroCliente(turma, filtro) {
  var t = String(turma || '').trim();
  var f = String(filtro || '').trim();
  if (!t || !f) return false;
  if (t === f) return true;
  return t.indexOf(f + '-') === 0;
}

function paPopularSeletores() {
  var wrapper = document.getElementById('paSeletores');
  var estagiarios = PA.dados.estagiarios || [];

  var semestresPresentes = {};
  estagiarios.forEach(function(e) {
    var sem = String(e.turma || '').split('-')[0];
    if (sem) semestresPresentes[sem] = true;
  });
  var semestres = Object.keys(semestresPresentes).sort().reverse();

  if (!semestres.length) {
    wrapper.style.display = 'none';
    PA.turmaFiltro = '';
    return;
  }
  wrapper.style.display = 'flex';

  var valoresValidos = [];
  var htmlSem = '';
  semestres.forEach(function(sem) {
    var rotulos = rotulosTurma(sem);
    htmlSem += '<option value="' + sem + '">' + rotulos.todas + '</option>';
    htmlSem += '<option value="' + sem + '-A">' + rotulos.antecipado + '</option>';
    htmlSem += '<option value="' + sem + '-R">' + rotulos.regular + '</option>';
    valoresValidos.push(sem, sem + '-A', sem + '-R');
  });

  if (valoresValidos.indexOf(PA.turmaFiltro) === -1) {
    var candidato = PA.dados.turmaCorrente || '';
    PA.turmaFiltro = valoresValidos.indexOf(candidato) !== -1 ? candidato : semestres[0];
  }

  var selSem = document.getElementById('paSelectSemestre');
  selSem.innerHTML = htmlSem;
  selSem.value = PA.turmaFiltro;

  var mostrarAluno = (PA.tipo === 'thales');
  document.getElementById('paSepAluno').style.display = mostrarAluno ? 'inline-block' : 'none';
  document.getElementById('paIconeAluno').style.display = mostrarAluno ? 'inline' : 'none';
  document.getElementById('paLabelAluno').style.display = mostrarAluno ? 'inline' : 'none';
  document.getElementById('paSelectAluno').style.display = mostrarAluno ? 'inline-block' : 'none';

  if (mostrarAluno) paPopularSelectAluno();
}

function paAlunosDaTurma() {
  var filtro = PA.turmaFiltro;
  return (PA.dados.estagiarios || [])
    .filter(function(e) { return turmaCasaComFiltroCliente(e.turma, filtro); })
    .sort(function(a, b) { return normalizarChave(a.nome) < normalizarChave(b.nome) ? -1 : 1; });
}

function paPopularSelectAluno() {
  var select = document.getElementById('paSelectAluno');
  var alunos = paAlunosDaTurma();
  var valorAtual = PA.alunoSelecionado ? PA.alunoSelecionado.email : '';

  select.innerHTML = '<option value="">— Selecione um aluno —</option>';
  alunos.forEach(function(a) {
    var opt = document.createElement('option');
    opt.value = a.email;
    var sufixo = a.finalizado ? ' — Finalizado' : '';
    if (String(a.turma || '').slice(-2) === '-A') sufixo += ' · Antecipado';
    opt.textContent = a.nome + sufixo;
    if (a.finalizado) opt.className = 'opcao-finalizada';
    if (a.email === valorAtual) opt.selected = true;
    select.appendChild(opt);
  });

  var aindaExiste = alunos.some(function(a) { return a.email === valorAtual; });
  if (valorAtual && !aindaExiste) {
    PA.alunoSelecionado = null;
    select.value = '';
  }
}

function paMudarTurma(valor) {
  PA.turmaFiltro = valor || '';
  if (PA.tipo === 'thales') {
    PA.alunoSelecionado = null;
    paPopularSelectAluno();
  }
  paRenderizarTudo();
}

function paMudarAluno(valor) {
  if (!valor) {
    PA.alunoSelecionado = null;
  } else {
    var achado = paAlunosDaTurma().filter(function(a) { return a.email === valor; })[0];
    PA.alunoSelecionado = achado ? { nome: achado.nome, email: achado.email } : null;
  }
  paRenderizarTudo();
}

// Aluno "em foco" no momento: para tipo 'aluno' e sempre a propria linha da
// turma escolhida (nunca ha o que escolher alem da turma); para tipo
// 'thales' e o que estiver selecionado no seletor de aluno (pode ser nenhum).
// Quando o filtro atual e um semestre inteiro ("Todas as turmas") e o aluno
// tem mais de uma linha nele (antecipado + regular), a primeira e devolvida
// so para fins de cabecalho/cards — a criacao de audiencia (que precisa de
// uma linha exata) tem sua propria checagem, ver paSalvarNovaAudiencia.
function paResolverAlunoAtual() {
  if (PA.tipo === 'thales') return PA.alunoSelecionado;
  var linha = paAlunosDaTurma()[0];
  return linha ? { nome: linha.nome, email: linha.email } : null;
}

// === CABECALHO (titulo + saudacao dinamicos) ===
// Usa so o primeiro nome como vocativo, mesmo criterio de primeiroNome()
// (Mensagens.js): sempre a primeira palavra do nome completo.
function paPrimeiroNome(nomeCompleto) {
  var nome = String(nomeCompleto || '').trim();
  if (!nome) return '';
  return nome.split(/\s+/)[0];
}

function paAtualizarCabecalho(alunoAtual) {
  var nome = alunoAtual ? alunoAtual.nome : (PA.tipo === 'thales' ? 'Aluno' : PA.nomeUsuario);
  document.getElementById('paHeaderNome').textContent = 'DE ' + paPrimeiroNome(nome).toUpperCase();
  var strong = document.getElementById('paSaudacaoNome');
  if (strong) strong.textContent = paPrimeiroNome(alunoAtual ? alunoAtual.nome : PA.nomeUsuario);
}

// === RENDERIZACAO PRINCIPAL ===
function paRenderizarTudo() {
  var alunoAtual = paResolverAlunoAtual();
  paAtualizarCabecalho(alunoAtual);
  document.getElementById('btnCriarPeticaoInicial').disabled = !alunoAtual;

  if (!alunoAtual) {
    document.getElementById('paSemAluno').style.display = 'block';
    document.getElementById('paConteudoAluno').style.display = 'none';
    return;
  }

  document.getElementById('paSemAluno').style.display = 'none';
  document.getElementById('paConteudoAluno').style.display = 'block';

  paRenderizarCards(alunoAtual);
  paRenderizarTabelas(alunoAtual);
}

// --- Filtragem client-side (turma + o unico aluno em foco) ---
// 27/07/2026: o filtro de turma casa direto contra r.turma (ja resolvida
// pelo servidor — registro -> aluno -> turma, ver getDadosPainelAluno,
// Aluno.js), em vez de r.semestre. Combinado ao filtro por nome/e-mail do
// aluno em foco, isso cobre corretamente a visao "Todas as turmas" para um
// aluno que fez antecipado e regular no mesmo semestre — cada registro
// pertence a uma e so uma turma, entao a soma das duas nao gera dupla
// contagem (mesmo raciocinio do Panorama, ver Scripts.html).
function paFiltrarPorAluno(lista, alunoAtual, camposNome, camposEmail) {
  var chaveNome = normalizarChave(alunoAtual.nome);
  var chaveEmail = normalizarChave(alunoAtual.email);
  return (lista || []).filter(function(r) {
    if (!turmaCasaComFiltroCliente(r.turma, PA.turmaFiltro)) return false;
    var okNome = camposNome.some(function(c) { return normalizarChave(r[c]) === chaveNome; });
    if (okNome) return true;
    if (!camposEmail || !camposEmail.length) return false;
    return camposEmail.some(function(c) { return normalizarChave(r[c]) === chaveEmail; });
  });
}

function paDiligenciasFiltradas(alunoAtual) {
  return paFiltrarPorAluno(PA.dados.diligencias, alunoAtual, ['estagiario'], []);
}
function paIniciaisFiltradas(alunoAtual) {
  return paFiltrarPorAluno(PA.dados.iniciais, alunoAtual, ['estagiario'], ['email']);
}
function paAtendimentosFiltrados(alunoAtual) {
  return paFiltrarPorAluno(PA.dados.atendimentos, alunoAtual, ['estagiario'], []);
}
function paAcompanhamentosFiltrados(alunoAtual) {
  return paFiltrarPorAluno(PA.dados.acompanhamentos, alunoAtual, ['estagiario'], ['email']);
}
function paAtendimentosOnlineFiltrados(alunoAtual) {
  return paFiltrarPorAluno(PA.dados.atendimentosOnline, alunoAtual, ['estagiario'], ['email']);
}
function paAtividadesElegiveisAOFiltradas(alunoAtual) {
  return paFiltrarPorAluno(PA.dados.atividadesElegiveisAO, alunoAtual, ['estagiario'], ['email']);
}
function paAudienciasFiltradas(alunoAtual) {
  return paFiltrarPorAluno(PA.dados.audienciasEstagiario, alunoAtual, ['estagiario'], ['email']);
}

// --- Cards resumo (mesmos 4 do Panorama + Acompanhamentos) ---
function paRenderizarCards(alunoAtual) {
  var diligencias = paDiligenciasFiltradas(alunoAtual).filter(naoEhCancelada);
  var iniciais = paIniciaisFiltradas(alunoAtual).filter(naoEhCancelada);
  var atendimentos = paAtendimentosFiltrados(alunoAtual);
  var atendimentosOnlineAprovados = paAtendimentosOnlineFiltrados(alunoAtual).filter(function(r) {
    return normalizarChave(r.status) === 'aprovado';
  });
  var acompanhamentos = paAcompanhamentosFiltrados(alunoAtual).filter(naoEhCancelada);
  // Audiências: card mostra so o TOTAL realizado (Aprovada), independente do
  // tipo — o detalhamento por tipo/meta fica na tabela (RN-05: so Aprovada conta).
  var audienciasAprovadas = paAudienciasFiltradas(alunoAtual).filter(function(r) {
    return normalizarChave(r.status) === 'aprovada';
  });

  var complexasDiligencias = diligencias.filter(function(r) { return normalizarChave(r.subespecie) === 'complexa'; }).length;
  var simples = diligencias.filter(function(r) { return normalizarChave(r.subespecie) === 'simples'; }).length;
  var complexas = complexasDiligencias + iniciais.length;
  var total = diligencias.length + iniciais.length;
  // Atendimentos = presenciais + Atendimentos Online aprovados (mesma regra
  // aplicada em Panorama.js/thales.html — pendentes/reprovados nao contam).
  var totalAtendimentos = atendimentos.length + atendimentosOnlineAprovados.length;

  var cards = [
    { label: 'TOTAL',          num: total,                   classe: 'card-total',       icone: ICONES.cardTotal,   alvo: 'topo' },
    { label: 'COMPLEXAS',      num: complexas,               classe: 'card-entregue',    icone: ICONES.complexas,   alvo: 'paBlocoDiligencias' },
    { label: 'SIMPLES',        num: simples,                 classe: 'card-encaminhado', icone: ICONES.simples,     alvo: 'paBlocoDiligencias' },
    { label: 'ACOMPANHAMENTOS', num: acompanhamentos.length, classe: 'card-devolvida',   icone: ICONES.acompanhamentos, alvo: 'paBlocoAcompanhamentos' },

// --- Rolagem dos cards ate a tabela correspondente ---
function paRolarPara(alvo) {
  if (alvo === 'topo') {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  var el = document.getElementById(alvo);
  if (!el) return;
  var header = document.querySelector('.header');
  var navBar = document.querySelector('.nav-bar');
  var offset = (header ? header.offsetHeight : 0) + (navBar ? navBar.offsetHeight : 0) + 16;
  var topoAlvo = el.getBoundingClientRect().top + window.pageYOffset - offset;
  window.scrollTo({ top: topoAlvo, behavior: 'smooth' });
}

function paCelulaVazia(colspan, titulo) {
  return '<tr><td colspan="' + colspan + '">' +
    '<div class="estado-vazio">' +

      '<div class="estado-vazio-titulo">' + titulo + '</div>' +

}

// --- Badge de status do Atendimento Online (Pendente/Aprovado/Reprovado) ---
function badgeStatusAtendimentoOnline(status) {
  var chave = normalizarChave(status);

  return '<span class="badge badge-ao-pendente">Pendente</span>';
}

// --- Copiar processo (icone nos modais) ---
function paCopiarTexto(spanId) {
  var el = document.getElementById(spanId);
  var texto = el ? el.textContent.trim() : '';
  if (!texto || texto === '—') return;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(function() {
      mostrarToast('Processo copiado!', 'sucesso');
    }, function() { paCopiarFallback(texto); });
  } else {
    paCopiarFallback(texto);
  }
}

function paCopiarFallback(texto) {
  var input = document.createElement('textarea');
  input.value = texto;
  input.style.position = 'fixed';
  input.style.opacity = '0';
  document.body.appendChild(input);
  input.focus();
  input.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(input);
  mostrarToast(ok ? 'Processo copiado!' : 'Não foi possível copiar o processo.', ok ? 'sucesso' : 'erro');
}

function paConfigurarCopiarProcesso() {
  var pares = [
    ['btnCopiarProcessoDiligencia', 'pdProcesso'],
    ['btnCopiarProcessoInicial', 'piViewProcesso'],
    ['btnCopiarProcessoAcompanhamento', 'acViewProcesso'],
    ['btnCopiarProcessoAudiencia', 'auViewProcesso']
  ];
  pares.forEach(function(par) {
    var btn = document.getElementById(par[0]);
    if (!btn) return;
    btn.addEventListener('click', function(e) { e.stopPropagation(); paCopiarTexto(par[1]); });
    btn.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); paCopiarTexto(par[1]); }
    });
  });
}

// === MODAL: CRIAR PETIÇÃO INICIAL ===
function paConfigurarMascaraCpf() {
  var input = document.getElementById('piCpf');
  if (!input) return;
  input.addEventListener('input', function() {
    var v = this.value.replace(/\D/g, '').slice(0, 11);
    if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{1,2})/, '$1.$2.$3-$4');
    else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{1,3})/, '$1.$2.$3');
    else if (v.length > 3) v = v.replace(/(\d{3})(\d{1,3})/, '$1.$2');
    this.value = v;
  });
}

function paSalvarPeticaoInicial() {
  var alunoAtual = paResolverAlunoAtual();
  if (!alunoAtual) {
    mostrarToast('Selecione um aluno antes de continuar.', 'erro');
    return;
  }

  var payload = {
    cpf: document.getElementById('piCpf').value,
    assistido: document.getElementById('piAssistido').value,
    especie: document.getElementById('piEspecie').value,
    emailAluno: alunoAtual.email
  };

  var btn = document.getElementById('btnSalvarPeticao');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">' + ICONES.carregando + '</span> Salvando...';

  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px;">' + ICONES.salvar + '</span> Salvar';

      if (!res.sucesso) {
        mostrarToast(res.erro || 'Erro ao salvar.', 'erro');
        return;
      }

      if (res.classroom && res.classroom.sucesso) {
        mostrarToast('Petição inicial ' + res.id + ' criada (prazo: ' + res.df + ') e enviada ao Classroom!', 'sucesso');
      } else {
        var motivo = (res.classroom && res.classroom.erro) || 'não foi possível criar a atividade no Classroom.';
        mostrarToast('Petição ' + res.id + ' salva (prazo: ' + res.df + '), mas ' + motivo, 'erro');
      }

      paFecharModalPeticao();
      paCarregarDados();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px;">' + ICONES.salvar + '</span> Salvar';
      mostrarToast('Erro: ' + err.message, 'erro');
    })
    .acaoCriarPedidoInicial(payload);
}

  var partes = valorAtividade.split('||');

  var payload = {
    tipoAtividade: partes[0],
    idAtividade: partes[1],
    data: document.getElementById('aoNovoData').value,
    atendido: document.getElementById('aoNovoAtendido').value,
    justificativa: document.getElementById('aoNovoJustificativa').value,
    emailAluno: alunoAtual.email
  };

  var btn = document.getElementById('btnSalvarNovoAtendimentoOnline');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">' + ICONES.carregando + '</span> Enviando...';

  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px;">' + ICONES.salvar + '</span> Enviar para aprovação';

      if (!res.sucesso) {
        mostrarToast(res.erro || 'Erro ao salvar.', 'erro');
        return;
      }
      mostrarToast('Atendimento online ' + res.id + ' enviado para aprovação!', 'sucesso');
      paFecharModalNovoAtendimentoOnline();
      paCarregarDados();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px;">' + ICONES.salvar + '</span> Enviar para aprovação';
      mostrarToast('Erro: ' + err.message, 'erro');
    })
    .acaoCriarAtendimentoOnline(payload);
}

// === MODAL: REGISTRAR AUDIÊNCIA ===
// Popula o select de Tipo a partir de bd!X:Z (PA.dados.parametrosAudiencias)
// — nunca uma lista fixa no HTML (RN do documento de requisitos).
function paPopularSelectTipoAudiencia(selectEl, valorAtual) {
  var parametros = PA.dados.parametrosAudiencias || [];
  selectEl.innerHTML = '<option value="">— Selecione —</option>';
  parametros.forEach(function(p) {
    var opt = document.createElement('option');
    opt.value = p.tipo;
    opt.textContent = p.tipo + ' (meta: ' + p.meta + ')';
    if (valorAtual && normalizarChave(p.tipo) === normalizarChave(valorAtual)) opt.selected = true;
    selectEl.appendChild(opt);
  });
}

function paAbrirModalNovaAudiencia() {
  var alunoAtual = paResolverAlunoAtual();
  if (!alunoAtual) {
    mostrarToast('Selecione um aluno antes de registrar uma audiência.', 'erro');
    return;
  }

  // Mesma checagem de paSalvarNovaAudiencia — bloqueia mais cedo, antes de
  // abrir o modal, quando "Todas as turmas" deixa o aluno em foco ambiguo
  // (mais de uma matricula no mesmo semestre).
  var linhasDoAluno = paAlunosDaTurma().filter(function(a) { return a.email === alunoAtual.email; });
  if (linhasDoAluno.length > 1) {
    mostrarToast('Você tem mais de uma matrícula neste semestre. Selecione a turma específica (Antecipado ou Regular) antes de registrar a audiência.', 'erro');
    return;
  }

  var parametros = PA.dados.parametrosAudiencias || [];
  if (!parametros.length) {
    mostrarToast('Nenhum tipo de audiência cadastrado. Procure o coordenador.', 'erro');
    return;
  }

  paPopularSelectTipoAudiencia(document.getElementById('auNovaTipo'), '');
  document.getElementById('auNovaData').value = '';
  document.getElementById('auNovaHora').value = '';
  document.getElementById('auNovaVara').value = '';
  document.getElementById('auNovaProcesso').value = '';
  document.getElementById('auNovaPartes').value = '';
  document.getElementById('auNovaObs').value = '';

  var aviso = document.getElementById('auNovaAviso');
  aviso.innerHTML = PA.avisoComprovanteAudiencia
    ? '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px;">' + ICONES.avisoEmail + '</span>' + PA.avisoComprovanteAudiencia
    : '';

  document.getElementById('paModalNovaAudienciaOverlay').classList.add('visivel');
}

function paFecharModalNovaAudiencia() {
  document.getElementById('paModalNovaAudienciaOverlay').classList.remove('visivel');
}

function paSalvarNovaAudiencia() {
  var alunoAtual = paResolverAlunoAtual();
  if (!alunoAtual) {
    mostrarToast('Selecione um aluno antes de continuar.', 'erro');
    return;
  }

  // A audiencia precisa ser gravada contra uma linha EXATA de "estagiarios"
  // (RN-02 — SEMESTRE e ESTATICO, copiado da linha no momento da criacao).
  // Com "Todas as turmas" selecionado, paResolverAlunoAtual() pode devolver a
  // primeira linha do aluno (ambiguo se ele fez antecipado E regular no mesmo
  // semestre) — nesse caso, exige que uma turma especifica seja escolhida no
  // seletor antes de registrar, em vez de arriscar gravar na turma errada.
  var linhasDoAluno = paAlunosDaTurma().filter(function(a) { return a.email === alunoAtual.email; });
  if (linhasDoAluno.length > 1) {
    mostrarToast('Você tem mais de uma matrícula neste semestre. Selecione a turma específica (Antecipado ou Regular) antes de registrar a audiência.', 'erro');
    return;
  }

  var payload = {
    data: document.getElementById('auNovaData').value,
    hora: document.getElementById('auNovaHora').value,
    tipo: document.getElementById('auNovaTipo').value,
    vara: document.getElementById('auNovaVara').value,
    processo: document.getElementById('auNovaProcesso').value,
    partes: document.getElementById('auNovaPartes').value,
    obs: document.getElementById('auNovaObs').value,
    turma: linhasDoAluno[0].turma,
    emailAluno: alunoAtual.email
  };

  var btn = document.getElementById('btnSalvarNovaAudiencia');
  btn.disabled = true;
  btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;">' + ICONES.carregando + '</span> Registrando...';

  google.script.run
    .withSuccessHandler(function(res) {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px;">' + ICONES.salvar + '</span> Registrar';

      if (!res.sucesso) {
        mostrarToast(res.erro || 'Erro ao registrar.', 'erro');
        return;
      }

      // RN-13, momento 2: aviso obrigatorio tambem na confirmacao de sucesso.
      var mensagemSucesso = 'Audiência ' + res.id + ' registrada e enviada para aprovação.';
      if (PA.avisoComprovanteAudiencia) mensagemSucesso += ' ' + PA.avisoComprovanteAudiencia;
      mostrarToast(mensagemSucesso, 'sucesso');

      paFecharModalNovaAudiencia();
      paCarregarDados();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px;">' + ICONES.salvar + '</span> Registrar';
      mostrarToast('Erro: ' + err.message, 'erro');
    })
    .acaoCriarAudienciaEstagiario(payload);
}

// === MODAL: DETALHE / REENVIO DE AUDIÊNCIA ===
function paAbrirModalDetalheAudiencia(idx) {
  var reg = PA._audienciasAtuais[idx];
  if (!reg) return;
  PA._audienciaEmEdicao = reg;

  document.getElementById('auViewIdLabel').textContent = reg.id || 'AUDIÊNCIA';
  document.getElementById('auViewTipo').textContent = reg.tipo || '';
  document.getElementById('auViewBadges').innerHTML = badgeStatusAudiencia(reg.status);

  var chaveStatus = normalizarChave(reg.status);
  var ehEditavel = chaveStatus === 'pendente' || chaveStatus === 'reprovada';

  var motivoWrapper = document.getElementById('auViewMotivoWrapper');
  if (chaveStatus === 'reprovada' && reg.obsAprovacao) {
    motivoWrapper.style.display = 'block';
    document.getElementById('auViewMotivo').textContent = reg.obsAprovacao;
  } else {
    motivoWrapper.style.display = 'none';
  }

  var btnReenviar = document.getElementById('btnReenviarAudiencia');
  if (ehEditavel) {
    document.getElementById('auViewSomenteLeitura').style.display = 'none';
    document.getElementById('auEditWrapper').style.display = 'block';
    document.getElementById('auEditData').value = '';
    document.getElementById('auEditHora').value = '';
    paPopularSelectTipoAudiencia(document.getElementById('auEditTipo'), reg.tipo);
    document.getElementById('auEditVara').value = reg.vara || '';
    document.getElementById('auEditProcesso').value = reg.processo || '';
    document.getElementById('auEditPartes').value = reg.partes || '';
    document.getElementById('auEditObs').value = reg.obs || '';
    var avisoEdit = document.getElementById('auEditAviso');
    avisoEdit.innerHTML = PA.avisoComprovanteAudiencia
      ? '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px;">' + ICONES.avisoEmail + '</span>' + PA.avisoComprovanteAudiencia
      : '';
    btnReenviar.style.display = 'inline-flex';
  } else {
    document.getElementById('auViewSomenteLeitura').style.display = 'block';
    document.getElementById('auViewData').textContent = reg.data || '—';
    document.getElementById('auViewHora').textContent = reg.hora || '—';
    document.getElementById('auViewVara').textContent = reg.vara || '—';
    document.getElementById('auViewProcesso').textContent = reg.processo || '—';
    document.getElementById('auViewPartes').textContent = reg.partes || '—';
    document.getElementById('auViewObs').textContent = reg.obs || '—';
    document.getElementById('auEditWrapper').style.display = 'none';
    btnReenviar.style.display = 'none';
  }

  document.getElementById('paModalAudienciaOverlay').classList.add('visivel');
}

function paReenviarAudiencia() {

  var payload = {

      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px;">' + ICONES.reenviar + '</span> Reenviar';

      if (!res.sucesso) {
        mostrarToast(res.erro || 'Erro ao reenviar.', 'erro');
        return;
      }
      mostrarToast('Audiência reenviada para aprovação!', 'sucesso');
      paFecharModal('paModalAudienciaOverlay');
      paCarregarDados();
    })
    .withFailureHandler(function(err) {
      btn.disabled = false;
      btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:16px;vertical-align:-3px;margin-right:4px;">' + ICONES.reenviar + '</span> Reenviar';
      mostrarToast('Erro: ' + err.message, 'erro');

}
